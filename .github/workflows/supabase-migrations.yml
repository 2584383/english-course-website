# Applique automatiquement les migrations SQL de supabase/migrations/
# à la base Supabase de production, à chaque push sur main qui en ajoute
# ou en modifie une. Lancement manuel possible depuis l'onglet Actions.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel : supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   mot de passe de la base (Project Settings → Database)
#   SUPABASE_PROJECT_REF   référence du projet (ehaamwhplmfykeicaqyc)

name: Migrations Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Jamais deux déploiements de migrations en parallèle
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Lier le projet Supabase
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Migrations en attente
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Appliquer les migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
